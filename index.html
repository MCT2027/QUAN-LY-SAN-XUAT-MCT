<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCT – Quản lý máy & sản lượng</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#e3e6ec;--run:#157f3b;--runbg:#e4f5ea;--stop:#b42318;--stopbg:#fdeceb;--idle:#667085;--idlebg:#eef0f3;--acc:#1d4ed8;--warn:#b45309;--warnbg:#fef3e2}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf1;--mute:#9aa3b2;--line:#2c3340;--run:#4ade80;--runbg:#12301d;--stop:#f87171;--stopbg:#3a1a19;--idle:#9aa3b2;--idlebg:#262c37;--acc:#7aa2ff;--warn:#fbbf24;--warnbg:#3a2c10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar>*{flex:0 0 auto}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:46px;max-width:100%;font-size:16px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;min-height:46px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{background:var(--stop);border-color:var(--stop);color:#fff}
.btn.run{background:var(--run);border-color:var(--run);color:#fff}
@media(prefers-color-scheme:dark){.btn.run,.btn.danger{color:#10131a}.btn.primary{color:#10131a}}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:0 0 auto;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;background:var(--card);cursor:pointer;min-height:44px}
.chip.on{border-color:var(--acc);background:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.chip.on{color:#10131a}}
nav button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;font-weight:700;font-size:16px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{padding:12px;max-width:1100px;margin:0 auto}
.banner{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mname{font-size:20px;font-weight:700}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
.tag.RUN{background:var(--runbg);color:var(--run)}
.tag.STOP{background:var(--stopbg);color:var(--stop)}
.tag.IDLE{background:var(--idlebg);color:var(--idle)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.big{min-height:52px;font-size:17px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}
.kv b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
h2{font-size:17px;margin:18px 0 8px}
h3{margin:0 0 10px}
.slot input{width:100px;min-height:48px;font-size:18px;text-align:right}
.bar select,.bar input{flex:1 1 130px}
#mbox>.row:last-child{position:sticky;bottom:-16px;background:var(--card);padding:10px 0 4px;margin-top:8px}
.rb{font-size:16px}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tile{aspect-ratio:1;border:0;border-radius:14px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;cursor:pointer;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tile{position:relative}
.tile.sel{outline:4px solid var(--acc);outline-offset:-2px}
.tile .ck{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:#fff;color:#111;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;border:2px solid #111}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px}
.selbar .btn{flex:1}
body.selm main{padding-bottom:96px}
.tile .tn{font-size:22px;font-weight:800;line-height:1}
.tile .ti{font-size:12px;line-height:1.25;font-weight:600;width:100%;overflow:hidden}
.tile.RUN{background:#16a34a}
.tile.STOP{background:#f5c518;color:#2b2200}
.tile.BROKE{background:#d92d20}
.tile.IDLE{background:#8a93a3}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#mbox{background:var(--card);border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
@media(min-width:700px){#modal{align-items:center}#mbox{border-radius:16px}}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rb{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:14px 8px;font-weight:700;cursor:pointer;min-height:54px}
.rb.sm{min-height:50px;padding:10px 6px;font-size:15px}
.rb.on{border-color:var(--stop);background:var(--stopbg);color:var(--stop)}
.fld{display:block;margin-top:10px;font-size:13px;color:var(--mute)}
.fld input,.fld select{display:block;width:100%;margin-top:4px;color:var(--ink)}
.dash{display:grid;grid-template-columns:1fr;gap:6px}@media(min-width:760px){.dash{grid-template-columns:1fr 1fr}.dash .kpis,.dash .wide{grid-column:1/-1}}.dash .card{margin:0;padding:8px 10px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 8px}.kl{font-size:11px;color:var(--mute)}.kpv{font-size:17px;font-weight:700;line-height:1.2}.ks{font-size:11px;color:var(--mute)}
.hb{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}.hb .nm{width:64px;flex:none}.hb .tr{flex:1;background:var(--idlebg);border-radius:5px;height:12px}.hb .tr i{display:block;height:12px;border-radius:5px;background:var(--acc);min-width:2px}.hb b{width:78px;text-align:right;flex:none}
.cols{display:flex;gap:8px;align-items:flex-end;height:96px;margin-top:4px}.cols>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px}.cols i{display:block;width:60%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bar2{height:10px;background:var(--acc);border-radius:5px;min-width:2px}
.err{color:var(--stop);font-size:13px;margin-top:8px}
[hidden]{display:none!important}
header{padding:4px 8px}
.top{display:flex;align-items:center;gap:6px}
.top nav{flex:1;margin:0;min-width:0}
nav button{padding:6px 10px!important;font-size:14px!important;border-bottom-width:2px!important}
.btn.sm{min-height:34px;padding:2px 10px;font-size:13px;white-space:nowrap}
#infp{margin:4px 0}
.chips{padding:4px 0 0!important;gap:6px}
.chip{min-height:36px;padding:3px 12px;font-size:14px;border-width:2px}
main{padding:8px!important}
.tiles{gap:6px;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.tile{padding:6px;border-radius:10px}
.tile .tn{font-size:18px}
.tile .ti{font-size:11px;line-height:1.2}
.tile .ck{width:22px;height:22px;font-size:14px;top:4px;right:4px}
#mbox{padding:12px}
.rb{min-height:46px;padding:8px 6px}
.rb.sm{min-height:42px;padding:6px}
#mbox h3{margin:0 0 8px}
.fld{margin-top:8px}
.selbar{padding:8px}
.row.tight{margin:0 0 6px}
.row.tight .btn{min-height:40px;padding:4px 6px;font-size:13px}
main{padding:6px!important}
.tiles{gap:5px;grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.tile{padding:5px;border-radius:9px}
.tile .tn{font-size:16px}
.tile .ti{font-size:10px;line-height:1.15}
.tile .ck{width:18px;height:18px;font-size:12px;top:3px;right:3px}
.chip{min-height:30px;padding:2px 10px;font-size:13px}
.chips{gap:5px}
.btn.sm{min-height:30px;font-size:12px}
.row.tight .btn{min-height:36px}

/* nút 3D nổi */
.btn,.chip{border-radius:12px;transition:transform .06s,box-shadow .06s}
.btn{background-image:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);box-shadow:0 3px 0 rgba(0,0,0,.22),0 5px 10px rgba(0,0,0,.14);border-color:rgba(0,0,0,.12)}
.btn.primary,.btn.run,.btn.danger{background-image:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%);box-shadow:0 4px 0 rgba(0,0,0,.4),0 6px 12px rgba(0,0,0,.2)}
.btn:active,.chip:active,.ktile:active,.tile:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.3)!important}
.btn:disabled{box-shadow:none;transform:none}
.chip{background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 60%);box-shadow:0 3px 0 rgba(0,0,0,.18),0 4px 8px rgba(0,0,0,.1)}
.chip.on{box-shadow:0 3px 0 rgba(0,0,0,.4),0 4px 8px rgba(0,0,0,.18)}
.tile{background-image:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 50%,rgba(0,0,0,.12));box-shadow:0 4px 0 rgba(0,0,0,.32),0 6px 10px rgba(0,0,0,.18)}
.tile.sel{box-shadow:0 4px 0 rgba(0,0,0,.32),0 6px 10px rgba(0,0,0,.18)}
.ktiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 2px 8px}
@media(min-width:700px){.ktiles{grid-template-columns:repeat(4,1fr)}}
.ktile{position:relative;aspect-ratio:1/0.82;border:0;border-radius:20px;background-color:var(--acc);color:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background-image:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 50%,rgba(0,0,0,.16));box-shadow:0 7px 0 rgba(0,0,0,.38),0 12px 18px rgba(0,0,0,.22);transition:transform .06s,box-shadow .06s}
.ktile .ki{font-size:34px;line-height:1}.ktile .kn{font-size:16px;letter-spacing:.5px}
.ktile.out{background-color:#d92d20}.ktile.in{background-color:#16a34a}
.ktile .kb{position:absolute;top:8px;right:10px;background:#fff;color:#111;border-radius:999px;min-width:26px;padding:1px 8px;font-size:13px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ktile.out .kb{color:#d92d20}
@media(prefers-color-scheme:dark){.ktile{color:#10131a}.ktile.out,.ktile.in{color:#fff}}
.khead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.khead b{font-size:17px}

.kban{background:linear-gradient(135deg,var(--acc),#0b2a8a);color:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.28),0 8px 14px rgba(0,0,0,.18);margin-bottom:12px}
.kban .kt{font-size:19px;font-weight:800;letter-spacing:.5px}
@media(prefers-color-scheme:dark){.kban{color:#10131a;background:linear-gradient(135deg,var(--acc),#3b5bb5)}}
.kpis4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:700px){.kpis4{grid-template-columns:repeat(4,1fr)}}
.kpi.big{padding:10px 12px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.1)}.kpi.big .kpv{font-size:22px;font-weight:800;line-height:1.2}.kpi.big .kl{font-size:12px}
.ktiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ktiles3 .ktile{aspect-ratio:1/0.95;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.38),0 10px 14px rgba(0,0,0,.2)}.ktiles3 .ktile .ki{font-size:30px}.ktiles3 .ktile .kn{font-size:14px}
.kgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.kgrid{grid-template-columns:1fr 1fr}}
.krow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.krow:first-of-type{border-top:0}
.kbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));max-width:100vw}
.kb3{flex:1;position:relative;border:0;border-radius:14px;padding:6px 2px;background:var(--bg);color:var(--ink);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);box-shadow:0 3px 0 rgba(0,0,0,.22);min-height:54px}
.kb3 .ki{font-size:21px;line-height:1}.kb3.on{background-color:var(--acc);color:#fff}.kb3:active{transform:translateY(3px);box-shadow:none}
.kb3 .kbd{position:absolute;top:1px;right:2px;background:#d92d20;color:#fff;border-radius:999px;min-width:18px;padding:0 5px;font-size:11px;font-weight:800}
@media(prefers-color-scheme:dark){.kb3.on{color:#10131a}}
.kbar.k8{gap:3px;padding-left:4px;padding-right:4px}.kbar.k8 .kb3{min-width:0;font-size:9px;letter-spacing:-.2px;white-space:nowrap;padding:5px 0;min-height:52px;border-radius:12px}.kbar.k8 .kb3 span:not(.ki):not(.kbd){max-width:100%;overflow:hidden;text-overflow:clip}.kbar.k5{display:grid;grid-template-columns:repeat(5,1fr)}.kbar.k8 .kb3 .ki{font-size:20px}
body.kbarm main{padding-bottom:96px!important}body.kbarm8 main{padding-bottom:96px!important}

.stp{display:flex;align-items:stretch;gap:6px;margin-top:4px}.stp input{flex:1;min-width:0;text-align:center;font-size:20px;font-weight:700;-moz-appearance:textfield}.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sb{width:52px;min-height:46px;border:0;border-radius:12px;font-size:24px;font-weight:800;background:var(--acc);color:#fff;cursor:pointer;background-image:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%);box-shadow:0 3px 0 rgba(0,0,0,.38)}.sb:active{transform:translateY(3px);box-shadow:none}
@media(prefers-color-scheme:dark){.sb{color:#10131a}}
.qc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.qc .chip{min-height:34px;padding:2px 12px;font-size:14px}
details.kd>summary{cursor:pointer;font-weight:700;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;list-style:none;box-shadow:0 3px 0 rgba(0,0,0,.12)}
details.kd>summary::-webkit-details-marker{display:none}details.kd[open]>summary{margin-bottom:6px}
.kban{padding:10px 12px!important;margin-bottom:8px!important}.kban .kt{font-size:16px!important}
.kpis4{gap:6px!important;margin-bottom:8px!important}.kpi.big{padding:8px 10px!important}.kpi.big .kpv{font-size:19px!important}
.ktiles3{gap:8px!important;margin-bottom:8px!important}

.hsrch{display:flex;gap:6px;margin-bottom:2px}.hsrch input{flex:1;min-width:0}.hsrch .btn{min-height:46px;padding:0 14px}
.hcats{padding:6px 0 2px!important}.hcats .chip{min-height:34px;padding:2px 12px;font-size:13px}
.hrow{display:flex;align-items:center;gap:6px;margin:4px 0 10px}.hrow .hcats{flex:1;min-width:0;overflow-x:auto;flex-wrap:nowrap;margin:0}.hrow .hcats .chip{flex:none}.kact{display:flex;gap:5px;flex:none}.kact .btn{width:44px;min-height:40px;padding:0;font-size:20px;position:relative;white-space:nowrap}
.kact .kbd{position:absolute;top:-6px;right:-2px;background:#fff;color:#d92d20;border-radius:999px;min-width:20px;padding:0 6px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.3)}
</style>

<body>
<header>
  <div class="top"><nav id="nav"></nav><button class="btn sm" id="inf"></button></div>
  <div class="bar" id="infp" hidden>
    <input id="who" placeholder="Tên người thao tác">
    <input id="dt" type="date">
    <select id="sh"><option value="D">Ca ngày 08–20</option><option value="N">Ca đêm 20–08</option></select>
    <button class="btn sm" id="now">Ca hiện tại</button>
  </div>
  <div class="chips" id="grps"></div>
  <div class="chips" id="slots"></div>
</header>
<main id="view"><p class="mute">Đang tải…</p></main>
<div id="modal"><div id="mbox"></div></div>

<script>window.MCT_API='https://script.google.com/macros/s/AKfycbxYx-k_21uix6zZPy-gmdNRodOUNYvNSuBsyvTuc1ALmlWnviqfzMe1ckdJImNWQcdwgQ/exec';</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const REASONS=[
 {code:'ST01',name:'Thay dao'},{code:'ST02',name:'Máy hỏng'},{code:'ST03',name:'Sửa kích thước'},
 {code:'ST04',name:'Đào tạo'},{code:'ST05',name:'Vệ sinh'},{code:'ST07',name:'Chờ vật tư / QC'},
 {code:'ST08',name:'Đổi model / setup'},{code:'ST09',name:'Mất điện'},{code:'ST06',name:'Dừng khác'}];
const NEW_TOOL='Xuất mới';
const TC_REASONS=['Hết Tool Life','Gãy dao','Via','NG kích thước','NG ngoại quan',NEW_TOOL];
const RN=Object.fromEntries(REASONS.map(r=>[r.code,r.name]));
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmtDur=min=>{min=Math.max(0,Math.round(min));return min>=60?Math.floor(min/60)+'h'+pad(min%60):min+'p'};

let db=null,user=null,canWrite=true,isAdmin=false;
const S={autoDone:false,selMode:false,selected:new Set(),slot:null,dept:'SL',cfg:{groups:[],models:[]},state:{},logs:[],prod:[],ctx:null,group:'',tab:'work',loaded:{},err:'',unsub:{}};

function shiftOfNow(){const n=new Date(),h=n.getHours();
 if(h>=8&&h<20)return{date:fmtDate(n),shift:'D'};
 if(h>=20)return{date:fmtDate(n),shift:'N'};
 const y=new Date(n);y.setDate(y.getDate()-1);return{date:fmtDate(y),shift:'N'}}
function win(date,shift){const[y,m,d]=date.split('-').map(Number);
 const s=new Date(y,m-1,d,shift==='D'?8:20,0).getTime();return[s,s+12*3600e3]}
const slotHours=shift=>shift==='D'?[8,11,14,17]:[20,23,2,5];
const ovl=(s,e,ws,we)=>Math.max(0,Math.min(e,we)-Math.max(s,ws))/60000;
const getModel=n=>S.cfg.models.find(m=>m.name===n);
const dg=()=>S.cfg.groups.filter(g=>(g.dept||'SL')===S.dept);
const DN={SL:'SL',KT:'KT'};
function viewMachines(){if(S.group==='ALL')return[...new Set(dg().flatMap(g=>g.machines))];const g=dg().find(g=>g.id===S.group);return g?g.machines:[]}
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const who=()=>($('#who').value||'').trim();

/* ---------- tính toán ---------- */
function calcMachine(m){
 const[ws,we]=win(S.ctx.date,S.ctx.shift),now=Date.now(),eff=Math.min(we,now);
 const ev=[];for(const l of S.logs)if(l.machine===m)for(const x of l.models||[])if(x.start&&x.t>=ws&&x.t<we)ev.push(x.t);
 const hasSt=S.state[m]&&S.state[m].status!=='IDLE',from=ev.length?Math.max(ws,Math.min(...ev)):(hasSt?ws:null);
 const total=from==null?0:Math.max(0,(eff-from)/60000),by={};let stop=0;
 for(const l of S.logs)if(l.machine===m)for(const s of l.stops){
  const e=s.end??now;const v=from==null?0:ovl(s.start,e,from,eff);if(v>0){by[s.reason]=(by[s.reason]||0)+v;stop+=v}}
 const run=Math.max(0,total-stop);
 let ok=0,ng=0,entered=0;
 const p=S.prod.find(p=>p.machine===m&&p.shift===S.ctx.shift);
 if(p)for(const k in p.slots){ok+=+p.slots[k].ok||0;ng+=+p.slots[k].ng||0;entered++}
 return{total,stop,run,by,ok,ng,entered,avail:total?run/total*100:0}}

async function getLog(m,date){
 const ref=db.doc('logs/'+m+'_'+date),sn=await ref.get();
 const d=sn.exists?JSON.parse(JSON.stringify(sn.data())):{machine:m,date,stops:[],models:[]};
 d.stops=d.stops||[];d.models=d.models||[];return{ref,d}}
function needWho(){if(!who()){toast('Nhập tên người thao tác trước.');$('#infp').hidden=false;$('#who').focus();return false}
 if(!canWrite){toast('Tài khoản này chỉ xem, không có quyền ghi.');return false}return true}
function toast(t){const b=document.createElement('div');b.className='banner';b.textContent=t;b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:30;max-width:520px;margin:auto';document.body.appendChild(b);setTimeout(()=>b.remove(),3500)}

async function doStart(m,model,t){
 const{ref,d}=await getLog(m,fmtDate(new Date(t)));
 d.models.push({t,from:S.state[m]?.model||'',to:model,start:true,by:who()});await ref.set(d);
 await db.doc('state/'+m).set({machine:m,status:'RUN',model,since:t,openStop:null,by:who()})}
async function doChangeModel(m,model){
 const now=Date.now(),{ref,d}=await getLog(m,fmtDate(new Date(now)));
 d.models.push({t:now,from:S.state[m].model,to:model,by:who()});await ref.set(d);
 await db.doc('state/'+m).update({model,by:who()})}
async function doStop(m,p){
 const now=Date.now(),date=fmtDate(new Date(now)),{ref,d}=await getLog(m,date),id=uid();
 d.stops.push({id,reason:p.reason,start:now,end:null,note:p.note||'',tool:p.tool||null,model:S.state[m]?.model||'',by:who()});
 await ref.set(d);
 await db.doc('state/'+m).set({machine:m,status:'STOP',model:S.state[m]?.model||'',since:now,reason:p.reason,openStop:{date,id},by:who()});
 if(p.tool){try{await db.doc('inv_req/tc_'+id).set({id:'tc_'+id,at:now,by:who(),byId:myId||null,machine:m,src:'TC',stopId:id,status:'PEND',lines:[{code:p.tool.code,qty:1}],note:'Thay dao: '+(p.tool.reason||'')+(p.tool.qty!=null?' · đã chạy '+p.tool.qty+' pcs':'')+(S.state[m]?.model?' · '+S.state[m].model:'')});toast('Đã gửi yêu cầu dao '+p.tool.code+' cho thủ kho.')}catch(e){toast('Đã ghi dừng máy nhưng chưa gửi được yêu cầu cho thủ kho.')}}}
async function doRun(m,endTs,edited,note){
 const st=S.state[m],{ref,d}=await getLog(m,st.openStop.date),s=d.stops.find(x=>x.id===st.openStop.id);
 if(s){s.end=endTs;if(edited)s.edit={by:who(),at:Date.now(),note:note||''};await ref.set(d)}
 await db.doc('state/'+m).set({machine:m,status:'RUN',model:st.model,since:endTs,openStop:null,by:who()})}

const slotEntry=(m,i)=>S.prod.find(p=>p.machine===m&&p.shift===S.ctx.shift)?.slots?.[i];
function curSlot(){
 if(S.slot!=null)return S.slot;
 const ms=viewMachines().filter(x=>!isOP1(x)),[ws]=win(S.ctx.date,S.ctx.shift),now=Date.now();
 for(let i=0;i<4;i++)if(ws+(i+1)*10800e3<=now&&ms.some(m=>!slotEntry(m,i)))return i;
 return Math.min(3,Math.max(0,Math.floor((now-ws)/10800e3)))}
const slotLabel=i=>{const h=slotHours(S.ctx.shift)[i];return pad(h)+'–'+pad((h+3)%24)};

 const ms=viewMachines(),KT=S.dept==='KT';
 if(!ms.length)return'<p class="mute">Chưa có máy trong nhóm này. Vào Cài đặt để khai báo nhóm/máy.</p>';
 let h='';const cs=KT?0:curSlot();
 if(KT){
  if(S.selMode)h+=`<div class="row tight"><button class="btn" data-a="selall">Chọn tất cả</button><button class="btn" data-a="selnone">Bỏ chọn</button><button class="btn" data-a="selexit">Thoát</button></div>`;
  else{const nr=ms.filter(m=>stOf(m)==='RUN').length,nz=ms.filter(m=>stOf(m)!=='RUN').length;
   h+=`<div class="row tight"><button class="btn primary" data-a="selon">☑ Chọn</button><button class="btn danger" data-a="stopall" ${nr?'':'disabled'}>DỪNG TẤT CẢ (${nr})</button><button class="btn run" data-a="runall" ${nz?'':'disabled'}>RUN TẤT CẢ (${nz})</button></div>`}}
 h+='<div class="tiles">'+ms.map(m=>{
  const st=S.state[m]||{status:'IDLE'},stat=st.status,broke=stat==='STOP'&&st.reason==='ST02',cls=broke?'BROKE':stat;
  let info;
  if(KT)info=esc(st.model||'')+'<br>'+(stat==='IDLE'?'Chưa chạy':(stat==='STOP'?esc(RN[st.reason]||'Dừng')+'<br>':'')+`<span data-since="${st.since}">${fmtDur((Date.now()-st.since)/60000)}</span>`);
  else if(stat==='IDLE')info='Chưa chạy';

  if(!KT&&isOP1(m))return`<button class="tile IDLE" disabled style="opacity:.4;cursor:not-allowed"><span class="tn">${esc(dispName(m))}</span><span class="ti">OP1<br>không nhập</span></button>`;
  const on=KT&&S.selMode&&S.selected.has(m);

 if(KT&&S.selMode){const n=S.selected.size;h+=`<div class="selbar"><button class="btn danger big" data-a="selstop" ${n?'':'disabled'}>DỪNG (${n})</button><button class="btn run big" data-a="selrun" ${n?'':'disabled'}>RUN (${n})</button></div>`}
 return h}

async function saveSlot(m,i,ok,ng){
 const id=m+'_'+S.ctx.date+'_'+S.ctx.shift,ref=db.doc('prod/'+id),sn=await ref.get();
 const d=sn.exists?JSON.parse(JSON.stringify(sn.data())):{machine:m,date:S.ctx.date,shift:S.ctx.shift,slots:{},hist:[]};
 d.slots=d.slots||{};d.hist=d.hist||[];const now=Date.now(),old=d.slots[i];
 if(old&&old.ok===ok&&old.ng===ng)return;
 if(old)d.hist.push({slot:i,ok:old.ok,ng:old.ng,by:old.by,at:old.at,replacedBy:who(),replacedAt:now});
 d.slots[i]={ok,ng,by:who(),at:now,model:S.state[m]?.model||''};
 await ref.set(d);
 const k=S.prod.findIndex(p=>p.machine===m&&p.shift===S.ctx.shift);if(k>=0)S.prod[k]=d;else S.prod.push(d)}

function mesCard(){
 const A=S.cfg.assign||{},st=['D','N'].filter(k=>A[k]).map(k=>`Ca ${k==='D'?'ngày':'đêm'}: ${esc(A[k].day)} · ${Object.keys(A[k].map).length} máy`).join('<br>')||'Chưa nạp dữ liệu MES.';
 return`<div class="card" style="margin-top:10px"><h3>Nhập dữ liệu MES</h3><p class="mute">Chọn file User Reg tải từ MES (.xlsx). Hệ thống lấy máy nào đang chạy mã hàng nào theo ca ghi trong file; máy mới chưa có nhóm được đưa vào nhóm "MCT (chưa phân nhóm)". Mỗi ngày nạp lại một lần.</p>
 <input type="file" id="mesfile" accept=".xlsx,.xls" style="width:100%"><div id="mesout" class="mute" style="margin-top:6px">${st}</div></div>`}
document.addEventListener('change',async e=>{
 if(e.target.id!=='mesfile')return;const f=e.target.files[0];if(!f)return;const out=$('#mesout');
 if(!window.XLSX){out.textContent='Chưa tải được thư viện đọc Excel, kiểm tra mạng.';return}
 try{
  out.textContent='Đang đọc file…';
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let rows=null,hi=-1;
  for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});const i=r.findIndex(x=>x&&x.some(c=>String(c||'').trim()==='Equip No'));if(i>=0){rows=r;hi=i;break}}
  if(!rows){out.textContent='Không thấy cột "Equip No" trong file.';return}
  const H=rows[hi].map(h=>String(h||'').trim().toUpperCase()),ix=k=>H.findIndex(h=>h.startsWith(k));
  const cE=ix('EQUIP NO'),cP=ix('PART NO'),cN=ix('ITEM'),cS=ix('WORK PART'),cD=ix('WORKING DAY');
  if(cE<0||cP<0||cS<0){out.textContent='Thiếu cột Equip No / Part No / Work Part.';return}
  const A=JSON.parse(JSON.stringify(S.cfg.assign||{})),maps={D:{},N:{}},days={};let n=0,bad=0;
  for(const r of rows.slice(hi+1)){
   const m=String(r[cE]||'').trim();if(!m)continue;if(!/^[A-Za-z0-9_\-]+$/.test(m)){bad++;continue}
   const sh=+r[cS]===2?'N':'D',part=shortPart(r[cP]);if(!part)continue;
   const a=maps[sh][m]||(maps[sh][m]=[]);if(!a.some(x=>x.part===part)){a.push({part,name:shortPart(r[cN]).slice(0,80)});n++}
   if(cD>=0&&r[cD])days[sh]=String(r[cD])}
  const shifts=['D','N'].filter(k=>Object.keys(maps[k]).length);
  if(!shifts.length){out.textContent='Không có dòng hợp lệ.';return}
  shifts.forEach(k=>{const d=days[k]||'';A[k]={day:d.length===8?d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6):d,map:maps[k]}});
  const cfg=JSON.parse(JSON.stringify(S.cfg));cfg.assign=A;
  const all=[...new Set(shifts.flatMap(k=>Object.keys(maps[k])))].sort();let added=0;
  for(const dept of ['SL','KT']){
   const have=new Set(cfg.groups.filter(g=>(g.dept||'SL')===dept).flatMap(g=>g.machines)),miss=all.filter(x=>!have.has(x));
   if(!miss.length)continue;added+=miss.length;
   let g=cfg.groups.find(x=>x.dept===dept&&x.name==='MCT (chưa phân nhóm)');
   if(!g){g={id:'g'+(cfg.groups.length+1),dept,name:'MCT (chưa phân nhóm)',manager:'',machines:[]};cfg.groups.push(g)}
   g.machines=[...new Set([...g.machines,...miss])].sort()}
  const known=new Set(cfg.models.map(x=>x.name));let nm=0;

async function saveCfg(){
 const er=$('#er');er.textContent='';
 try{
  const groups=$('#cg').value.split('\n').map(x=>x.trim()).filter(Boolean).map((l,i)=>{
   let p=l.split('|').map(s=>s.trim());if(p.length===3)p=['SL',...p];
   if(p.length<4||!['SL','KT'].includes(p[0].toUpperCase()))throw new Error('Dòng nhóm sai định dạng (SL/KT | Tên | Người | Máy): '+l);
   return{id:'g'+(i+1),dept:p[0].toUpperCase(),name:p[1],manager:p[2],machines:p[3].split(',').map(s=>s.trim()).filter(Boolean)}});
  const seen=new Set();groups.forEach(g=>g.machines.forEach(m=>{if(!/^[A-Za-z0-9_\-]+$/.test(m))throw new Error('Tên máy chỉ gồm chữ, số, - _ : '+m);const k=g.dept+'|'+m;if(seen.has(k))throw new Error('Máy trùng giữa các nhóm '+g.dept+': '+m);seen.add(k)}));
  const models=$('#cm').value.split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{
   const p=l.split('|').map(s=>s.trim());
   const tools=(p[1]||'').split(',').map(s=>s.trim()).filter(Boolean).map(t=>{const q=t.split(':').map(s=>s.trim());
    if(q.length<3||isNaN(+q[2]))throw new Error('Dao sai định dạng: '+t);return{code:q[0],name:q[1],life:+q[2]}});
   return{name:p[0],tools,title:(p[3]||'').slice(0,80)}});
  const machines={},op1=[];
  $('#cmm').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{const p=l.split(/\s*\|\s*|\t/).map(x=>x.trim());
   if(p.length<2||!/^[A-Za-z0-9_\-]+$/.test(p[0]))throw new Error('Dòng danh mục máy sai (Mã máy | Loại | Kỹ thuật | Sản lượng | OP1): '+l);
   machines[p[0]]={t:p[1],k:p[2]||'',s:p[3]||''};if(/^(x|1|true|op1)$/i.test(p[4]||''))op1.push(p[0])});
  (S.cfg.op1||[]).forEach(m=>{if(!machines[m]&&!op1.includes(m))op1.push(m)});
  const keys=new Set([...groups.map(g=>g.dept+'|'+g.name),'KHO|Thủ kho']),members=Object.fromEntries(Object.entries(S.cfg.members||{}).filter(([k])=>keys.has(k)));
  await db.doc('config/main').set({groups,models,members,op1,assign:S.cfg.assign||{},machines});toast('Đã lưu cài đặt.')
 }catch(e){er.textContent=e.message}}

 if(!names.may&&!names.md&&!names.pt)res.errs.push('Không thấy sheet DM_May, PhuTrach hoặc Model_Dao trong file.');
 return res}

const djb=str=>{let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return h.toString(36)};
const GROUP_ALIAS={'tool':'Tool gia công','tool gia công':'Tool gia công','dao cụ':'Dao cụ','holder / collet':'Holder / Collet','holder':'Holder / Collet','collet':'Holder / Collet','vật tư phụ tùng':'Vật tư phụ tùng','phụ tùng':'Vật tư phụ tùng','linh kiện dự phòng':'Vật tư phụ tùng','dầu tưới nguội':'Dầu tưới nguội','vật tư tiêu hao':'Vật tư tiêu hao','supplies expense':'Vật tư tiêu hao','vpp':'VPP','văn phòng phẩm':'VPP'};
const normCode=c=>String(c==null?'':c).trim().replace(/\s+/g,'_');
function parseTemplate(wb){
 const T=v=>String(v==null?'':v).trim();
 // đọc bảng: tự tìm dòng tiêu đề (dòng đầu tiên có cột bắt buộc), cột trùng tên được đánh số _1, _2
 const sh=(n,must)=>{const ws=wb.Sheets[n];if(!ws)return null;const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let hi=A.findIndex(r=>r.some(x=>T(x)===must));if(hi<0)return[];
  const seen={},H=A[hi].map(x=>{let h=T(x);if(!h)return'';if(seen[h]!=null){seen[h]++;h=h+'_'+seen[h]}else seen[h]=0;return h});
  return A.slice(hi+1).map((r,i)=>{const o={__row:hi+2+i};H.forEach((h,j)=>{if(h)o[h]=r[j]===undefined?'':r[j]});return o})};
 const res={errs:[],items:[],ins:[],opens:[],fixed:0,models:{},machines:{},op1:[],has:{}},E=m=>res.errs.push(m);
 const vt=sh('DM_VatTu','Mã vật tư');
 if(vt){res.has.vt=1;vt.forEach(r=>{const raw=T(r['Mã vật tư']);if(!raw)return;const c=normCode(raw);if(c!==raw)res.fixed++;
  const g0=T(r['Nhóm']),g=g0?(INV_GROUPS.includes(g0)?g0:GROUP_ALIAS[g0.toLowerCase()]||''):'',mn=+(r['Tồn tối thiểu']||0),pr=+(r['Đơn giá (VND)']||0),op=r['Tồn kho']===''?0:+r['Tồn kho'],at='DM_VatTu dòng '+r.__row+': ';
  if(!/^[A-Za-z0-9_\-.]+$/.test(c))return E(at+'mã chỉ gồm chữ, số, - _ . khoảng trắng ('+raw+')');
  if(g0&&!g)return E(at+'nhóm không nhận ra ('+g0+'). Dùng: '+INV_GROUPS.join(', ')+' hoặc Tool / Linh kiện dự phòng / Supplies expense');
  if(!(mn>=0)||!(pr>=0))return E(at+'tồn tối thiểu / đơn giá phải là số ≥ 0');
  if(!(op>=0)||!Number.isInteger(op))return E(at+'tồn đầu kỳ phải là số nguyên ≥ 0 ('+r['Tồn kho']+')');
  res.items.push({code:c,name:T(r['Tên']).slice(0,80),grp:g,spec:T(r['Quy cách']).slice(0,60),unit:T(r['ĐVT']).slice(0,12),barcode:T(r['Barcode']).slice(0,40),min:mn,price:pr});if(op>0)res.opens.push({code:c,qty:op})})}
 const codes=new Set([...Object.keys(S.items),...res.items.map(x=>x.code)]),seen=new Set();
 res.items.forEach(x=>{if(seen.has(x.code))E('DM_VatTu: mã trùng '+x.code);seen.add(x.code)});
 const nk=sh('NhapKho','Mã vật tư');
 if(nk){res.has.nk=1;nk.forEach(r=>{const raw=T(r['Mã vật tư']);if(!raw)return;const c=normCode(raw),qv=r['Số lượng'],q=+qv,at='NhapKho dòng '+r.__row+': ';
  if(!codes.has(c))return E(at+'mã '+raw+' chưa có trong danh mục');if(qv===''||!(Number.isInteger(q)&&q>0))return E(at+'số lượng phải là số nguyên > 0');

 if(md){res.has.md=1;md.forEach(r=>{const m=T(r['Mã hàng (model)']);if(!m)return;const dc=T(r['Mã dao']);if(!dc)return;const life=+r['Tuổi thọ chuẩn (pcs)'],at='Model_Dao dòng '+r.__row+': ';
  if(!(life>0))return E(at+'tuổi thọ chuẩn phải là số > 0');
  const o=res.models[m]||(res.models[m]={title:'',tools:[]});if(!o.title)o.title=T(r['Tên hàng']).slice(0,80);
  if(o.tools.some(x=>x.code===dc))return E(at+'dao '+dc+' bị trùng trong model '+m);o.tools.push({code:dc,name:T(r['Tên dao']),life})})}
 const mm=sh('DM_May','Mã máy');
 if(mm){res.has.mm=1;mm.forEach(r=>{const m=T(r['Mã máy']);if(!m)return;if(!/^[A-Za-z0-9_\-]+$/.test(m))return E('DM_May dòng '+r.__row+': mã máy chỉ gồm chữ, số, - _ ('+m+')');
  res.machines[m]={t:T(r['Loại máy']),k:T(r['Nhóm kỹ thuật']),s:T(r['Nhóm sản lượng'])};if(/^(x|1|true)$/i.test(T(r['OP1 (x)'])))res.op1.push(m)})}
 return res}

 const tabs=[['SL','Sản lượng'],['KT','Kỹ thuật'],['report','Báo cáo'],['inv','Kho'+(isKeeper()&&S.pendN?' ('+S.pendN+')':'')]];if(isAdmin)tabs.push(['settings','Cài đặt']);

 else $('#slots').innerHTML='';

 $('#view').innerHTML=pre+body;
 if(S.tab==='settings')hydrate()}
let raf=0;const rr=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};

document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-tab],[data-a],[data-grp],[data-slot]');if(!t)return;
 if(t.dataset.slot){S.slot=+t.dataset.slot;rr();return}
 if(t.dataset.grp){S.selMode=false;S.selected.clear();S.group=t.dataset.grp;store('mct_grp_'+S.dept,S.group);rr();return}
 if(t.dataset.tab){const k=t.dataset.tab;S.selMode=false;S.selected.clear();
  if(k==='SL'||k==='KT'){S.dept=k;store('mct_dept',k);S.tab='work';S.group=load('mct_grp_'+k);fixGroup()}else{if(k==='inv'&&S.tab==='inv')S.kho='home';S.tab=k}
  rr();return}
 const a=t.dataset.a,m=t.dataset.m;
 if(KHO_A.includes(a))return;
 try{
  if(a==='rptdet'){S.rptDet=!S.rptDet;render();return}
  if(a==='csv'){const x=csvText();try{await navigator.clipboard.writeText(x);toast('Đã copy, dán vào Excel.')}catch(_){$('#csvout').innerHTML=`<textarea readonly>${esc(x)}</textarea>`}return}
  if(a==='savecfg'){await saveCfg();return}
  if(a==='memadd'||a==='memdel'){const key=t.dataset.key,id=t.dataset.id,mem=JSON.parse(JSON.stringify(S.cfg.members||{})),arr=mem[key]||[];
   mem[key]=a==='memadd'?(arr.includes(id)?arr:[...arr,id]):arr.filter(x=>x!==id);
   await db.doc('config/main').update({members:mem});return}
  if(a==='selon'){S.selMode=true;S.selected.clear();rr();return}
  if(a==='selexit'){S.selMode=false;S.selected.clear();rr();return}
  if(a==='selall'){viewMachines().forEach(x=>S.selected.add(x));rr();return}
  if(a==='selnone'){S.selected.clear();rr();return}
  if(a==='seltoggle'){S.selected.has(m)?S.selected.delete(m):S.selected.add(m);rr();return}
  if(!needWho())return;
  const picked=()=>viewMachines().filter(x=>S.selected.has(x));
  if(a==='selstop')stopAllModal(picked());else if(a==='selrun')runAllModal(picked());else
  if(a==='stopall')stopAllModal();else if(a==='runall')runAllModal();else if(a==='tile')tileModal(m);else if(a==='ptile'){if(isOP1(m)){toast('Máy '+m+' chạy OP1, không nhập sản lượng.');return}const sx=S.state[m];if(!sx||sx.status==='IDLE')toast('Máy '+m+' chưa chạy nên chưa nhập được sản lượng. Vào Kỹ thuật bấm RUN trước.');else prodModal(m)}else if(a==='start')startModal(m);else if(a==='stop')stopModal(m);else if(a==='run')runModal(m);
  else if(a==='model')modelModal(m);else if(a==='saveprod')await saveProd(m);
 }catch(err){toast('Lỗi: '+(err.message||err.code||err))}});

function subLogs(){
 S.unsub.logs&&S.unsub.logs();S.loaded.logs=false;
 const[ws,we]=win(S.ctx.date,S.ctx.shift),ds=[...new Set([fmtDate(new Date(ws-864e5)),fmtDate(new Date(ws)),fmtDate(new Date(we-1))])];
 S.unsub.logs=db.collection('logs').where('date','in',ds).onSnapshot(sn=>{S.logs=sn.docs.map(d=>d.data());S.loaded.logs=true;rr()},e=>{S.err='Lỗi đọc dữ liệu dừng máy: '+e.code;rr()})}
function subProd(){
 S.unsub.prod&&S.unsub.prod();S.loaded.prod=false;
 S.unsub.prod=db.collection('prod').where('date','==',S.ctx.date).onSnapshot(sn=>{S.prod=sn.docs.map(d=>d.data());S.loaded.prod=true;rr()},e=>{S.err='Lỗi đọc sản lượng: '+e.code;rr()})}

/* ---------- máy chủ Google Sheets (không cần tài khoản claude) ---------- */
function remoteDb(api,cred,me,users){
 const mem={};let ver=0,pending=0,busy=false;const subs=[];
 const clone=o=>JSON.parse(JSON.stringify(o));
 const mergeO=(a,b)=>{const o=Object.assign({},a);for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?mergeO(o[k],v):v}return o};
 const call=async body=>{let r;try{r=await fetch(api,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({id:cred.id,pw:cred.pw},body))})}catch(e){throw Object.assign(new Error('Không kết nối được máy chủ'),{code:'network'})}
  let j;try{j=await r.json()}catch(e){throw Object.assign(new Error('Máy chủ trả lời sai'),{code:'bad_response'})}
  if(!j.ok)throw Object.assign(new Error(j.err||'server'),{code:j.err||'server'});return j};
 const notify=()=>subs.slice().forEach(f=>f());
 const apply=docs=>docs.forEach(c=>{if(c.del)delete mem[c.p];else mem[c.p]=c.d});
 const sync=async full=>{if(busy||pending>0)return;busy=true;try{const j=await call({a:'sync',since:full?0:ver});
   if(full)for(const k in mem)delete mem[k];apply(j.docs);ver=j.ver;if(full||j.docs.length)notify()}finally{busy=false}};
 let chain=Promise.resolve();
 const write=ops=>{
  ops.forEach(o=>{if(o.op==='delete')delete mem[o.path];else mem[o.path]=o.op==='update'?mergeO(mem[o.path]||{},clone(o.data)):clone(o.data)});notify();
  pending++;
  const p=chain.then(async()=>{const j=await call({a:'write',ops,since:ver});apply(j.docs);ver=j.ver;notify()});
  chain=p.catch(()=>{});
  return p.catch(async e=>{pending--;busy=false;try{await sync(true)}catch(x){}throw e}).then(v=>{pending--;return v})};
 const doc=p=>({id:p.split('/').pop(),
  async get(){return{exists:p in mem,data:()=>clone(mem[p])}},
  set(d){return write([{op:'set',path:p,data:d}])},
  update(d){return write([{op:'update',path:p,data:d}])},
  delete(){return write([{op:'delete',path:p}])},
  onSnapshot(cb){const f=()=>cb({exists:p in mem,data:()=>clone(mem[p])});subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}});
 const coll=n=>{const fl=[];const q={where(f,op,v){fl.push([f,op,v]);return q},
  onSnapshot(cb){const f=()=>cb({docs:Object.keys(mem).filter(k=>k.startsWith(n+'/')).map(k=>({id:k.slice(n.length+1),data:()=>clone(mem[k])})).filter(d=>{const x=d.data();return fl.every(([a,op,v])=>op==='in'?v.includes(x[a]):x[a]===v)})});subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}};return q};
 const user={me:async()=>({id:me.id,name:me.name}),canEdit:()=>me.role==='admin',can:p=>p==='data.write'?me.role!=='view':true,
  search:async q=>{q=(q||'').toLowerCase();return users.filter(u=>u.name.toLowerCase().includes(q)).slice(0,8).map(u=>({id:u.id,name:u.name}))},
  profiles:async ids=>{const o={};ids.forEach(i=>{const u=users.find(x=>x.id===i);o[i]={name:u?u.name:i}});return o}};
 if(typeof setInterval==='function'&&typeof document!=='undefined'&&document.addEventListener){
  setInterval(()=>{if(document.visibilityState!=='hidden')sync(false).catch(()=>{})},20000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync(false).catch(()=>{})})}
 return{db:{doc,collection:coll,batch:ops=>write(ops)},user,sync,role:me.role}}
async function remoteLogin(api,id,pw){
 const r=await fetch(api,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'login',id,pw})});
 const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.err),{code:j.err});
 const R=remoteDb(api,{id,pw},j.user,j.users);await R.sync(true);R.me=j.user;return R}
function loginOverlay(msg,needApi,defApi){
 return new Promise(res=>{
  const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML='<div class="card" style="max-width:420px;width:100%"><h3 style="margin:0 0 6px">Đăng nhập</h3><div class="mute" id="lgm" style="margin-bottom:8px"></div>'+(needApi?'<input id="lgapi" placeholder="Địa chỉ máy chủ (link Apps Script)" style="width:100%;margin-bottom:8px">':'')+'<input id="lgid" placeholder="Mã nhân viên" autocomplete="username" style="width:100%;margin-bottom:8px"><input id="lgpw" type="password" placeholder="Mật khẩu" autocomplete="current-password" style="width:100%"><div class="row" style="margin-top:10px"><button class="btn primary" id="lgok">Vào</button><button class="btn" id="lgloc">Dùng thử trên máy này</button></div></div>';
  document.body.appendChild(o);o.querySelector('#lgm').textContent=msg||'Nhập mã nhân viên và mật khẩu được cấp.';
  if(needApi&&defApi)o.querySelector('#lgapi').value=defApi;
  o.querySelector('#lgok').onclick=()=>{const api=needApi?o.querySelector('#lgapi').value.trim():defApi,id=o.querySelector('#lgid').value.trim(),pw=o.querySelector('#lgpw').value.trim();if(!api||!id||!pw){o.querySelector('#lgm').textContent='Nhập đủ thông tin.';return}o.remove();res({api,id,pw})};
  o.querySelector('#lgloc').onclick=()=>{o.remove();res(null)}})}
async function connectRemote(){
 const fixed=(typeof window!=='undefined'&&window.MCT_API)||'';let api=fixed||load('mct_api')||'',uid0=load('mct_id')||'',pw0=load('mct_pw')||'',msg='';
 if(!fixed&&!api&&typeof claude!=='undefined'&&!window.MCT_FORCE_LOGIN)return null;
 for(let t=0;t<6;t++){
  if(api&&uid0&&pw0){try{const R=await remoteLogin(api,uid0,pw0);store('mct_api',api);store('mct_id',uid0);store('mct_pw',pw0);return R}catch(e){msg=e.code==='bad_code'?'Mã nhân viên hoặc mật khẩu không đúng.':e.code==='locked'?'Nhập sai quá nhiều lần, thử lại sau 10 phút.':'Không kết nối được máy chủ ('+(e.message||e.code)+').';if(e.code==='bad_code'||e.code==='locked'){store('mct_pw','');pw0=''}}}
  const a=await loginOverlay(msg,!fixed,api);if(!a)return null;api=a.api;uid0=a.id;pw0=a.pw}
 return null}
function localDb(){
 const KEY='mct_localdb_v1';let mem={};
 try{const r=localStorage.getItem(KEY);if(r)mem=JSON.parse(r)}catch(e){}
 const subs=[];
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}};
 const clone=o=>JSON.parse(JSON.stringify(o));
 const merge=(a,b)=>{const o=Object.assign({},a);for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?merge(o[k],v):v}return o};
 const note=()=>{save();subs.slice().forEach(f=>f())};
 const doc=p=>({id:p.split('/').pop(),
  async get(){return{exists:p in mem,data:()=>clone(mem[p])}},
  async set(d){mem[p]=clone(d);note()},
  async update(d){mem[p]=merge(mem[p]||{},clone(d));note()},
  async delete(){delete mem[p];note()},
  onSnapshot(cb){const f=()=>cb({exists:p in mem,data:()=>clone(mem[p])});subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}});
 const coll=n=>{const fl=[];const q={
  where(f,op,v){fl.push([f,op,v]);return q},
  onSnapshot(cb){const f=()=>cb({docs:Object.keys(mem).filter(k=>k.startsWith(n+'/')&&k.indexOf('/',n.length+1)<0).map(k=>({id:k.slice(n.length+1),data:()=>clone(mem[k])})).filter(d=>{const x=d.data();return fl.every(([a,op,v])=>op==='in'?v.includes(x[a]):x[a]===v)})});subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}};return q};
 return{doc,collection:coll};
}
(async()=>{
 S.dept=load('mct_dept')==='KT'?'KT':'SL';S.ctx=shiftOfNow();$('#dt').value=S.ctx.date;$('#sh').value=S.ctx.shift;S.group=load('mct_grp_'+S.dept);render();
 try{db=await claude.use('db');user=await claude.use('user')}catch(e){db=null}
 if(!db||typeof db.doc!=='function'){db=null;user=null;try{const R=await connectRemote();if(R){db=R.db;user=R.user;S.remote=true;S.role=R.role;if(R.me&&!who()){$('#who').value=R.me.name;store('mct_who',R.me.name);$('#infp').hidden=true}}}catch(e){db=null}}
 if(user){try{const me=await user.me();myId=me.id;if(me.name&&!who()){$('#who').value=me.name;store('mct_who',me.name);$('#infp').hidden=true}}catch(e){}}
 if(user){isAdmin=!!(user.canEdit&&user.canEdit());const w=user.can&&user.can('data.write');canWrite=w!==false}
 if(!db||(typeof db.doc!=='function')){db=localDb();S.local=true;isAdmin=true;canWrite=true;myId=myId||'local'}
 const tm=setTimeout(()=>{if(!(S.loaded.cfg&&S.loaded.state)){S.err='Chưa kết nối được dữ liệu, kiểm tra mạng.';rr()}},10000);
 db.doc('config/main').onSnapshot(sn=>{
  const d=sn.exists?sn.data():null;S.cfg={groups:d?.groups||[],models:d?.models||[],members:d?.members||{},op1:d?.op1||[],assign:d?.assign||{},machines:d?.machines||{}};applyMine();
  fixGroup();
  S.loaded.cfg=true;S.err='';clearTimeout(tm);rr()},e=>{S.err='Lỗi đọc cài đặt: '+e.code;rr()});
 db.collection('state').onSnapshot(sn=>{S.state={};sn.docs.forEach(d=>S.state[d.id]=d.data());S.loaded.state=true;rr()},e=>{S.err='Lỗi đọc trạng thái máy: '+e.code;rr()});
 subLogs();subProd();
 db.collection('inv_req').where('status','==','PEND').onSnapshot(sn=>{S.pendN=sn.docs.length;rr()},()=>{});
})();
